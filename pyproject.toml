[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperterm"
version = "0.1.0"
description = "A keyboard-driven, themeable PDF reader for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["Pillow>=10.0", "prompt-toolkit>=3.0.43", "PyMuPDF>=1.24", "tomli>=2.0; python_version < '3.11'"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: General",
]

[project.scripts]
paperterm = "pdfnav.cli:main"

[tool.setuptools.packages.find]
include = ["pdfnav*"]
